services:
  web:
    build: .
    container_name: foodie_web
    environment:
      - PATH=/opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py seed &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: .
    container_name: foodie_celery_worker
    environment:
      - PATH=/opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    # Use python -m celery instead of celery command
    command: python -m celery -A foodie worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis
      - postgres

  celery_beat:
    build: .
    container_name: foodie_celery_beat
    environment:
      - PATH=/opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    # Use python -m celery instead of celery command
    command: python -m celery -A foodie beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - web
      - redis
      - postgres

  postgres:
    image: postgres:15
    container_name: foodie_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: foodie_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  static_volume:
  media_volume: