<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Set Your Password</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f7f9fc; margin: 0; padding: 0;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 24px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <tr>
                        <td style="font-size: 16px; color: #333333;">
                            <p style="margin-top: 0;">Hello {{ user.first_name }},</p>

                            <p>
                                Your account has been created successfully. To get started, please set your password by clicking the button below:
                            </p>

                            <p style="text-align: center; margin: 32px 0;">
                                <a href="{{ setup_link }}"
                                   style="display: inline-block; padding: 12px 24px; background-color: #4f46e5; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: bold;">
                                    Set Your Password
                                </a>
                            </p>

                            <p>
                                If you did not request this account, you can safely ignore this email.
                            </p>

                            <p style="margin-bottom: 0;">
                                Regards,<br />
                                Prafful Mali
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
