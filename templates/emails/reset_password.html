<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f6f7fb;
      padding: 20px;
    }
    .card {
      max-width: 480px;
      margin: auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .heading {
      text-align: center;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 16px;
    }
    .link-box {
      background-color: #f1f3f8;
      padding: 12px;
      border-radius: 6px;
      word-break: break-all;
      margin: 12px 0;
      font-size: 14px;
    }
    .footer {
      font-size: 12px;
      color: #777;
      margin-top: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heading">Reset Your Password</div>

    <p>Hello {{ user.first_name|default:"User" }},</p>

    <p>
      We received a request to reset your password. You can set a new password
      using the link below:
    </p>

    <div class="link-box">
      <a href="{{ reset_link }}">{{ reset_link }}</a>
    </div>

    <p>This link will expire in 15 minutes.</p>

    <div class="footer">
      If you didn’t request this, you can safely ignore this email.
    </div>
  </div>
</body>
</html>
