name: Deploy to EC2

on:
  push:
    branches: [feature/cicd]
  pull_request:
    branches: [feature/cicd]
    types: [closed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prafful-mali/foodie

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # --- App Secrets ---
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS || '*' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: postgres
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://redis:6379/0
          CELERY_RESULT_BACKEND: redis://redis:6379/1
          CELERY_TASK_TIME_LIMIT: ${{ secrets.CELERY_TASK_TIME_LIMIT }}
          CELERY_RESULT_EXPIRES: ${{ secrets.CELERY_RESULT_EXPIRES }}
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          GUNICORN_WORKERS: "3"
          GUNICORN_TIMEOUT: "120"
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,DOCKER_IMAGE,SECRET_KEY,DEBUG,ALLOWED_HOSTS,DB_NAME,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT,CELERY_BROKER_URL,CELERY_RESULT_BACKEND,CELERY_TASK_TIME_LIMIT,CELERY_RESULT_EXPIRES,EMAIL_BACKEND,EMAIL_HOST,EMAIL_PORT,EMAIL_USE_TLS,EMAIL_HOST_USER,EMAIL_HOST_PASSWORD,DEFAULT_FROM_EMAIL,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,RAZORPAY_WEBHOOK_SECRET,GUNICORN_WORKERS,GUNICORN_TIMEOUT
          script: |
            set -e

            APP_DIR="/home/${{ secrets.EC2_USER }}/foodie"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # ============================
            # 1. Bootstrap: Install Docker
            # ============================
            if ! command -v docker &> /dev/null; then
              echo "==> Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker $USER
              echo "==> Docker installed successfully"
            fi

            # ============================
            # 2. Clone or pull repository
            # ============================
            if [ ! -d "$APP_DIR" ]; then
              echo "==> Cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin feature/cicd
            git checkout feature/cicd
            git reset --hard origin/feature/cicd

            # ============================
            # 3. Generate .env file
            # ============================
            echo "==> Generating .env file..."
            > .env
            echo "SECRET_KEY=${SECRET_KEY}" >> .env
            echo "DEBUG=${DEBUG}" >> .env
            echo "ALLOWED_HOSTS=${ALLOWED_HOSTS}" >> .env
            echo "DB_NAME=${DB_NAME}" >> .env
            echo "DB_USER=${DB_USER}" >> .env
            echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
            echo "DB_HOST=${DB_HOST}" >> .env
            echo "DB_PORT=${DB_PORT}" >> .env
            echo "CELERY_BROKER_URL=${CELERY_BROKER_URL}" >> .env
            echo "CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}" >> .env
            echo "CELERY_TASK_TIME_LIMIT=${CELERY_TASK_TIME_LIMIT}" >> .env
            echo "CELERY_RESULT_EXPIRES=${CELERY_RESULT_EXPIRES}" >> .env
            echo "EMAIL_BACKEND=${EMAIL_BACKEND}" >> .env
            echo "EMAIL_HOST=${EMAIL_HOST}" >> .env
            echo "EMAIL_PORT=${EMAIL_PORT}" >> .env
            echo "EMAIL_USE_TLS=${EMAIL_USE_TLS}" >> .env
            echo "EMAIL_HOST_USER=${EMAIL_HOST_USER}" >> .env
            echo "EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}" >> .env
            echo "DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}" >> .env
            echo "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}" >> .env
            echo "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}" >> .env
            echo "RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}" >> .env
            echo "GUNICORN_WORKERS=${GUNICORN_WORKERS}" >> .env
            echo "GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT}" >> .env

            # ============================
            # 4. Login to GHCR and pull
            # ============================
            echo "==> Logging in to GHCR..."
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "==> Pulling latest image..."
            sudo docker pull "$DOCKER_IMAGE"

            # ============================
            # 5. Deploy with Docker Compose
            # ============================
            echo "==> Deploying..."
            sudo docker compose -f docker-compose.prod.yml down
            sudo DOCKER_IMAGE="$DOCKER_IMAGE" docker compose -f docker-compose.prod.yml up -d

            # Cleanup old images
            sudo docker image prune -f

            echo "==> Deployment complete!"